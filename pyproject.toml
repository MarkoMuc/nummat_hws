[project]
name = "nummat-hws"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "numpy>=2.3",
    "pytest>=8.4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["hw1"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["hw1/src"]
testpaths = ["hw1/tests"]
