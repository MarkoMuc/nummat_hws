[project]
name = "hw3"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]
